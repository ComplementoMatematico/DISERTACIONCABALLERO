<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartulina interactiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #1d1428;
    --pergamino: #fbf4e6;
    --tinta: #2d1f3d;
    --tinta-suave: #5d4c6e;
    --magenta: #c8227a;
    --magenta-claro: #fbe0ee;
    --verde: #1f8a4c;
    --luz: #ffe600;
    --proporcion: 0.4922; /* ancho / alto de la cartulina (630 / 1280) */
    --panel: 400px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 30%, #2e1f40, var(--fondo) 70%);
    color: var(--tinta);
    font-family: "Nunito", system-ui, sans-serif;
    display: grid;
    grid-template-columns: auto var(--panel);
    justify-content: center; align-items: center;
    gap: 28px; padding: 16px;
    height: 100dvh;
    user-select: none; -webkit-user-select: none;
  }

  /* ---------- Cartulina ---------- */
  .marco {
    position: relative;
    width: min(calc((100dvh - 32px) * var(--proporcion)), calc(100vw - var(--panel) - 60px));
    aspect-ratio: 630 / 1280;
    container-type: inline-size;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
    background: #000;
  }
  .marco img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .velo, .bordes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .velo rect.sombra { fill: rgba(18, 8, 28, .66); transition: opacity .45s; }
  .velo.apagado rect.sombra { opacity: 0; }
  .velo .hueco { transition: all .45s ease; }
  .bordes rect {
    fill: none; stroke: var(--luz); stroke-width: 7; rx: 10;
    filter: drop-shadow(0 0 6px var(--luz)) drop-shadow(0 0 14px rgba(255, 230, 0, .7));
    animation: titila 1.6s ease-in-out infinite;
  }
  @keyframes titila { 50% { stroke: #fff9c4; stroke-width: 9; } }

  .num {
    position: absolute; transform: translate(-50%, -50%);
    width: 14cqw; aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--magenta); color: #fff;
    border: .9cqw solid #fff;
    font-weight: 900; font-size: 7.4cqw; line-height: 1;
    opacity: 0; transition: opacity .35s, left .45s, top .45s;
    z-index: 3;
  }
  .num.activo { opacity: 1; animation: resplandor 1.4s ease-in-out infinite; }
  @keyframes resplandor {
    0%, 100% {
      transform: translate(-50%, -50%) scale(1);
      box-shadow: 0 0 0 0 rgba(255, 230, 0, .9), 0 0 2cqw 1cqw rgba(255, 230, 0, .9);
    }
    50% {
      transform: translate(-50%, -50%) scale(1.14);
      box-shadow: 0 0 0 3.2cqw rgba(255, 230, 0, 0), 0 0 7cqw 3cqw rgba(255, 230, 0, .85);
    }
  }
  /* Portada: todos los números pequeños y quietos */
  .marco.inicio .num { opacity: .92; width: 9cqw; font-size: 4.8cqw; border-width: .6cqw; animation: none; }

  /* ---------- Panel ---------- */
  .panel {
    width: var(--panel);
    background: var(--pergamino); border-radius: 22px;
    padding: 26px 26px 20px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .4);
    position: relative; overflow: hidden;
  }
  .panel::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px;
    background: repeating-linear-gradient(180deg, var(--magenta) 0 30px, var(--verde) 30px 60px);
  }
  .parte {
    display: inline-block; font-weight: 900; font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--magenta); background: var(--magenta-claro); padding: 5px 12px; border-radius: 99px;
  }
  .cabeza { display: flex; align-items: center; gap: 14px; margin: 14px 0 10px; }
  .cabeza .circulo {
    flex: none; width: 58px; height: 58px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--magenta); color: #fff; font-weight: 900; font-size: 28px;
    box-shadow: 0 0 0 4px #fff, 0 0 18px 4px rgba(255, 200, 0, .7);
  }
  .cabeza .circulo:empty { display: none; }
  h1 { font-family: "Cinzel Decorative", Georgia, serif; font-size: 27px; line-height: 1.12; }
  .texto { font-size: 19px; line-height: 1.4; }
  .texto b { color: var(--magenta); font-weight: 900; }
  .controles { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .controles button {
    border: 0; cursor: pointer; border-radius: 99px;
    font: 800 15px/1 "Nunito", system-ui, sans-serif;
    min-height: 44px; padding: 0 16px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  #ant { background: rgba(45, 31, 61, .1); color: var(--tinta); }
  #sig { background: var(--magenta); color: #fff; flex: 1; justify-content: center; }
  #ant:disabled, #sig:disabled { opacity: .35; cursor: default; }
  .puntos { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 16px; }
  .puntos i { width: 9px; height: 9px; border-radius: 50%; background: rgba(45, 31, 61, .18); transition: background .3s; }
  .puntos i.ok { background: var(--verde); }
  .puntos i.ya { background: var(--magenta); transform: scale(1.3); }

  #pantalla {
    position: fixed; top: 12px; right: 12px; z-index: 20;
    display: flex; align-items: center; gap: 8px;
    min-height: 40px; padding: 8px 14px;
    font: 800 14px/1 "Nunito", system-ui, sans-serif;
    color: #fff; background: rgba(255, 255, 255, .14);
    border: 1px solid rgba(255, 255, 255, .25); border-radius: 99px; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #pantalla svg { width: 18px; height: 18px; }
  #reloj {
    position: fixed; top: 12px; left: 12px; z-index: 20;
    display: none; min-height: 40px; padding: 10px 16px;
    font: 900 17px/1 "Nunito", system-ui, sans-serif; font-variant-numeric: tabular-nums;
    color: #fff; background: rgba(255, 255, 255, .14); border-radius: 99px;
  }
  #reloj.visible { display: block; }
  #reloj.alerta { background: #a5522a; }
  #pantalla[hidden] { display: none; }

  /* ---------- Vertical (celular, tablet, pantalla angosta) ---------- */
  @media (max-width: 899px), (orientation: portrait) {
    :root { --alto-panel: 182px; }
    body {
      grid-template-columns: 1fr; grid-template-rows: 1fr auto;
      gap: 10px; padding: 10px 10px max(10px, env(safe-area-inset-bottom));
      justify-items: center;
    }
    .marco { width: min(calc(100vw - 20px), calc((100dvh - var(--alto-panel) - 30px) * var(--proporcion))); }
    .panel {
      width: min(100%, 640px); height: var(--alto-panel);
      padding: 12px 16px 12px 22px; border-radius: 16px;
      display: grid; grid-template-rows: auto 1fr auto; align-content: start;
    }
    .panel::before { width: 7px; }
    .parte { display: none; }
    .cabeza { margin: 0 0 4px; gap: 10px; }
    .cabeza .circulo { width: 40px; height: 40px; font-size: 20px; box-shadow: 0 0 0 3px #fff, 0 0 12px 3px rgba(255, 200, 0, .7); }
    h1 { font-size: 19px; }
    .texto { font-size: 15px; line-height: 1.32; overflow-y: auto; }
    .controles { margin-top: 6px; }
    .controles button { min-height: 40px; font-size: 14px; }
    .puntos { display: none; }
    #pantalla { padding: 8px 10px; }
    #pantalla span { display: none; }
  }
  @media (min-width: 600px) and (orientation: portrait) {
    :root { --alto-panel: 220px; }
    h1 { font-size: 24px; }
    .texto { font-size: 18px; }
  }
</style>
</head>

  // Zonas en coordenadas de la cartulina (630 x 1280)
  const ZONAS = {"titulo": [150, 75, 485, 320], "caballo": [43, 190, 177, 335], "armadura": [430, 235, 595, 402], "corazones": [55, 330, 155, 555], "autor": [195, 395, 435, 600], "caballero": [10, 550, 255, 748], "julieta": [435, 505, 595, 710], "cristobal": [427, 700, 585, 790], "bufon": [325, 720, 430, 835], "merlin": [0, 830, 280, 962], "bolsalegre": [310, 830, 600, 970], "camino": [10, 940, 595, 1260], "silencio": [10, 1030, 155, 1180], "conocimiento": [145, 1120, 280, 1260], "voluntad": [290, 1150, 505, 1255], "ardilla": [360, 1040, 427, 1115], "paloma": [470, 1100, 540, 1180], "todo": [4, 4, 626, 1276]};
  // Dónde brilla el número de cada paso
  const NUMEROS = [[110, 115], [470, 450], [43, 200], [600, 330], [605, 480], [175, 810], [295, 955], [160, 1065], [215, 1100], [425, 1130], [470, 1050], [105, 1235], [173, 450], [315, 640]];
  const PASOS = [
    { parte: "Disertación", titulo: "El caballero de la armadura oxidada", zonas: [],
      texto: "Autor: <b>Robert Fisher</b>. Presenta: <b>Nombre y Apellido</b>, 6° básico." },
    { parte: "Introducción", titulo: "El título", zonas: ["titulo"],
      texto: "Saludo y presento el libro <b>El caballero de la armadura oxidada</b>, de <b>Robert Fisher</b>." },
    { parte: "Introducción", titulo: "El autor", zonas: ["autor"],
      texto: "Robert Fisher. Un caballero queda <b>atrapado en su armadura</b> y recorre el <b>Camino de la Verdad</b>." },
    { parte: "Desarrollo", titulo: "El Caballero", zonas: ["caballo", "corazones", "caballero"],
      texto: "<b>Bueno, generoso y amoroso</b>, pero preocupado de lo que decían de él. ¡Usaba la armadura hasta para dormir!" },
    { parte: "Desarrollo", titulo: "La armadura", zonas: ["armadura"],
      texto: "Yelmo, hombrera, peto, manopla, escarcela, rodillera, greba y escarpe. Lo <b>protegía</b>, pero <b>escondía lo que sentía</b>." },
    { parte: "Desarrollo", titulo: "Julieta y Cristóbal", zonas: ["julieta", "cristobal"],
      texto: "Julieta: <b>fiel, tolerante</b> y escribía poemas. Cristóbal: <b>cabello dorado</b>, casi no conocía la cara de su papá." },
    { parte: "Desarrollo", titulo: "Merlín y Bolsalegre", zonas: ["merlin", "bufon", "bolsalegre"],
      texto: "Merlín, <b>sabio maestro</b>. Bolsalegre, <b>divertido y alegre</b>. “Cuando el alumno está preparado, el maestro aparece”." },
    { parte: "Desarrollo", titulo: "El problema", zonas: ["camino"],
      texto: "La armadura <b>se oxidó y quedó pegada</b>. Para sacársela debe recorrer el <b>Camino de la Verdad</b>." },
    { parte: "Camino de la Verdad", titulo: "Castillo del Silencio", zonas: ["silencio"],
      texto: "Aprende a <b>escuchar su propia voz</b>. Llora… ¡y una parte de la armadura se cae!" },
    { parte: "Camino de la Verdad", titulo: "Castillo del Conocimiento", zonas: ["conocimiento"],
      texto: "<b>Reconoce sus errores</b>: le importaba más ser famoso que su familia." },
    { parte: "Camino de la Verdad", titulo: "Voluntad y Osadía", zonas: ["voluntad"],
      texto: "<b>Enfrenta sus miedos</b>: mientras más valiente, más pequeño el Dragón del Miedo y la Duda." },
    { parte: "El final", titulo: "La Cima de la Verdad", zonas: ["ardilla", "paloma"],
      texto: "Se suelta, confía y <b>la armadura cae completa</b>. Lo acompañaron la ardilla y la paloma Rebeca." },
    { parte: "Cierre", titulo: "Mi opinión", zonas: ["silencio", "conocimiento", "voluntad"],
      texto: "Lo que <b>más me gustó</b>: los tres castillos. Lo que <b>menos</b>: cuando deja sola a su familia." },
    { parte: "Cierre", titulo: "Mi solución", zonas: ["corazones", "julieta"],
      texto: "Sacarme la armadura en casa, <b>escuchar a mi familia</b> y <b>pedir ayuda a tiempo</b>." },
    { parte: "Cierre", titulo: "¡Muchas gracias!", zonas: ["todo"],
      texto: "Todos podemos tener una “armadura”. <b>Los invito a leer este libro.</b> ¿Alguna pregunta?" },
  ];

  const NS = "http://www.w3.org/2000/svg";
  const marco = document.getElementById("marco");
  const velo = document.getElementById("velo");
  const huecos = document.getElementById("huecos");
  const bordes = document.getElementById("bordes");
  const puntos = document.getElementById("puntos");
  let actual = 0;

  // Un número por paso (1 a 14) sobre la cartulina
  const nums = NUMEROS.map(([x, y], i) => {
    const n = document.createElement("div");
    n.className = "num";
    n.textContent = i + 1;
    n.style.left = (x / 630 * 100) + "%";
    n.style.top = (y / 1280 * 100) + "%";
    marco.appendChild(n);
    return n;
  });
  PASOS.forEach(() => puntos.appendChild(document.createElement("i")));

  function rect(z, extra) {
    const [x0, y0, x1, y1] = ZONAS[z];
    const r = document.createElementNS(NS, "rect");
    r.setAttribute("x", x0); r.setAttribute("y", y0);
    r.setAttribute("width", x1 - x0); r.setAttribute("height", y1 - y0);
    r.setAttribute("rx", 10);
    if (extra) r.setAttribute("fill", extra);
    return r;
  }

  function mostrar(i) {
    actual = Math.max(0, Math.min(PASOS.length - 1, i));
    const p = PASOS[actual];
    const todo = p.zonas[0] === "todo";

    marco.classList.toggle("inicio", actual === 0);
    velo.classList.toggle("apagado", actual === 0 || todo);
    huecos.replaceChildren(...p.zonas.filter(z => z !== "todo").map(z => rect(z, "#000")));
    bordes.replaceChildren(...p.zonas.map(z => rect(z)));
    nums.forEach((n, k) => n.classList.toggle("activo", k + 1 === actual));

    document.getElementById("parte").textContent = p.parte;
    document.getElementById("circulo").textContent = actual ? actual : "";
    document.getElementById("titulo").textContent = p.titulo;
    document.getElementById("texto").innerHTML = p.texto;
    document.getElementById("ant").disabled = actual === 0;
    document.getElementById("sig").disabled = actual === PASOS.length - 1;
    document.getElementById("sig").textContent = actual === 0 ? "Comenzar ▶" : "Siguiente ▶";
    [...puntos.children].forEach((d, k) => { d.className = k === actual ? "ya" : k < actual ? "ok" : ""; });
    try { history.replaceState(null, "", "#" + actual); } catch (e) {}
  }

  document.getElementById("sig").addEventListener("click", (e) => { e.stopPropagation(); mostrar(actual + 1); });
  document.getElementById("ant").addEventListener("click", (e) => { e.stopPropagation(); mostrar(actual - 1); });
  marco.addEventListener("click", () => mostrar(actual + 1));

  addEventListener("keydown", (e) => {
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); mostrar(actual + 1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); mostrar(actual - 1); }
    else if (e.key === "Home") mostrar(0);
    else if (e.key === "End") mostrar(PASOS.length - 1);
    else if (e.key === "f" || e.key === "F") alternarPantalla();
    else if (e.key === "t" || e.key === "T") {
      if (inicio === null) inicio = Date.now();
      reloj.classList.toggle("visible");
      tic();
    }
  });

  // Cronómetro (tecla T): se pone rojo en el minuto 9 de 10
  const reloj = document.getElementById("reloj");
  const LIMITE = 10 * 60;
  let inicio = null;
  function tic() {
    if (inicio === null) return;
    const seg = Math.floor((Date.now() - inicio) / 1000);
    reloj.textContent = `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, "0")}`;
    reloj.classList.toggle("alerta", seg >= LIMITE - 60);
  }
  setInterval(tic, 500);

  // Deslizar a los lados en celular
  let toque = null;
  addEventListener("touchstart", (e) => { toque = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
  addEventListener("touchend", (e) => {
    if (!toque) return;
    const dx = e.changedTouches[0].clientX - toque.x, dy = e.changedTouches[0].clientY - toque.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) mostrar(dx < 0 ? actual + 1 : actual - 1);
    toque = null;
  });

  // Pantalla completa (con prefijo webkit para Safari)
  const botonPantalla = document.getElementById("pantalla");
  const enPantalla = () => document.fullscreenElement || document.webkitFullscreenElement;
  function alternarPantalla() {
    const raiz = document.documentElement;
    const p = enPantalla()
      ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
      : (raiz.requestFullscreen || raiz.webkitRequestFullscreen).call(raiz);
    if (p && p.catch) p.catch(() => {});
  }
  function rotuloPantalla() {
    const dentro = !!enPantalla();
    botonPantalla.querySelector("span").textContent = dentro ? "Salir" : "Pantalla completa";
    botonPantalla.setAttribute("aria-label", dentro ? "Salir de pantalla completa" : "Pantalla completa");
  }
  // iPhone no permite pantalla completa en páginas: ahí se oculta el botón
  botonPantalla.hidden = !(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  botonPantalla.addEventListener("click", (e) => { e.stopPropagation(); alternarPantalla(); });
  document.addEventListener("fullscreenchange", rotuloPantalla);
  document.addEventListener("webkitfullscreenchange", rotuloPantalla);

  addEventListener("hashchange", () => mostrar(parseInt(location.hash.slice(1)) || 0));
  mostrar(parseInt(location.hash.slice(1)) || 0);
</script>
</body>
</html>
